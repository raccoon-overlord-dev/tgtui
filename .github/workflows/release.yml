# A tag v* builds the static Linux binaries in Docker and the macOS ones natively (TDLib
# compiles once per architecture and is cached) and publishes them with checksums as a
# GitHub release. Run by hand, it only builds: the binaries stay in the run's artifacts.
# Needs the repository secrets TGTUI_API_ID and TGTUI_API_HASH, embedded in the binaries.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: false # no .dockerbuild artifacts next to the binaries

jobs:
  linux:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          outputs: type=local,dest=out
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_JOBS=4
          secrets: |
            api_id=${{ secrets.TGTUI_API_ID }}
            api_hash=${{ secrets.TGTUI_API_HASH }}
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
      - name: Check and pack
        run: |
          file out/tgtui | grep -q 'statically linked'
          out/tgtui --version
          tar -C out -czf tgtui_linux_${{ matrix.arch }}.tar.gz tgtui
      - uses: actions/upload-artifact@v5
        with:
          name: tgtui_linux_${{ matrix.arch }}
          path: tgtui_linux_${{ matrix.arch }}.tar.gz

  darwin:
    strategy:
      matrix:
        include:
          - arch: arm64 # Apple silicon only: no Intel Mac build
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: brew install cmake gperf openssl@3 pkgconf
      - id: tdlib
        run: echo "commit=$(sed -n 's/^ARG TDLIB_COMMIT=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tgtui-build
          key: tdlib-darwin-${{ matrix.arch }}-${{ steps.tdlib.outputs.commit }}
      - name: Build
        env:
          API_ID: ${{ secrets.TGTUI_API_ID }}
          API_HASH: ${{ secrets.TGTUI_API_HASH }}
        run: make build VERSION=${{ github.ref_name }} # BUILD_JOBS 3: the arm64 runner has 7 GB
      - name: Check and pack
        run: |
          otool -L tgtui
          if otool -L tgtui | tail -n +2 | grep -v -e /usr/lib/ -e /System/; then exit 1; fi # only system libraries
          ./tgtui --version
          tar -czf tgtui_darwin_${{ matrix.arch }}.tar.gz tgtui
      - uses: actions/upload-artifact@v5
        with:
          name: tgtui_darwin_${{ matrix.arch }}
          path: tgtui_darwin_${{ matrix.arch }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, darwin]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: tgtui_*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum tgtui_*.tar.gz > checksums.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease) tgtui_*.tar.gz checksums.txt
